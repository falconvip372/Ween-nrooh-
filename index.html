<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Events App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body { font-family: Arial; padding: 20px; direction: rtl; }
#events-page { display: none; }
.event-box {
padding: 10px;
margin: 10px 0;
background: #f2f2f2;
border-radius: 6px;
}
</style>
</head>
<body>

<!-- صفحة تسجيل الدخول -->
<div id="login-page">
<h2>تسجيل الدخول</h2>

<input id="email" type="email" placeholder="الإيميل"><br><br>
<input id="password" type="password" placeholder="الرقم السري"><br><br>

<button onclick="login()">تسجيل الدخول</button>

<p id="login-error" style="color:red"></p>
</div>

<!-- صفحة عرض الفعاليات -->
<div id="events-page">
<h2>الفعاليات</h2>
<div id="events-list"></div>
</div>

<script>
// الاتصال بسوبابيز
const supabase = supabase.createClient(
"https://YOUR-PROJECT.supabase.co",
"YOUR-ANON-KEY"
);

// تسجيل الدخول
async function login() {
const email = document.getElementById("email").value.trim();
const password = document.getElementById("password").value.trim();

const { data, error } = await supabase.auth.signInWithPassword({
email: email,
password: password
});

if (error) {
document.getElementById("login-error").innerText = "خطأ: " + error.message;
return;
}

loadEvents();

document.getElementById("login-page").style.display = "none";
document.getElementById("events-page").style.display = "block";
}

// تحميل الفعاليات
async function loadEvents() {
const { data, error } = await supabase
.from('events')
.select('*');

if (error) {
document.getElementById("events-list").innerHTML =
`<p style="color:red">خطأ أثناء تحميل الفعاليات — تأكد من RLS</p>`;
return;
}

const container = document.getElementById("events-list");
container.innerHTML = "";

if (data.length === 0) {
container.innerHTML = "<p>لا توجد فعاليات.</p>";
return;
}

data.forEach(event => {
const box = document.createElement('div');
box.className = "event-box";
box.innerHTML = `
<strong>${event.title || "بدون عنوان"}</strong><br>
<span>${event.date || ""}</span>
`;
container.appendChild(box);
});
}
</script>

</body>
</html>
