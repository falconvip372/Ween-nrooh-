<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فعاليات السعودية - بالصور</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #10b981; --bg: #f1f5f9; --text: #1e293b; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; } /* جعلت العرض مناسب للجوال */

        /* تصميم شاشة الدخول */
        #setup-screen { background: white; padding: 30px; border-radius: 20px; text-align: center; margin-top: 50px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 10px; text-align: center; box-sizing: border-box; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }

        /* تصميم البطاقة الجديد مع الصورة */
        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden; /* لقص الصورة داخل الحدود */
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
            border: 1px solid #fff;
        }

        /* منطقة الصورة */
        .card-img {
            width: 100%;
            height: 200px;
            object-fit: cover; /* ملء المساحة دون تمطيط */
            background-color: #eee;
        }

        .card-body { padding: 20px; }
        .card h2 { margin: 0 0 10px; font-size: 1.3rem; color: #333; }
        .card p { color: #666; margin-bottom: 15px; font-size: 0.95rem; }

        .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .price { background: #ecfdf5; color: var(--primary); padding: 5px 15px; border-radius: 50px; font-weight: bold; }
        .location { color: #94a3b8; font-size: 0.9rem; display: flex; align-items: center; gap: 5px; }

        /* زر الخروج */
        .logout { display: block; margin: 30px auto; background: none; border: none; color: #ef4444; cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body>

    <!-- شاشة الإعداد -->
    <div id="setup-screen" style="display:none;">
        <h2>🔐 المفتاح السري</h2>
        <p>الرجاء لصق المفتاح (API Key) للمتابعة</p>
        <input type="text" id="apiKeyInput" placeholder="الصق المفتاح هنا">
        <button class="btn" onclick="saveKey()">دخول</button>
    </div>

    <!-- شاشة التطبيق -->
    <div id="app-screen" class="container" style="display:none;">
        <h1 style="text-align: center; color: var(--primary);">فعاليات السعودية 🇸🇦</h1>
        
        <div id="content">جاري التحميل...</div>
        
        <button onclick="logout()" class="logout">تسجيل خروج</button>
    </div>

<script>
    const PROJECT_URL = 'https://delpsaqasgfatojvnwkl.supabase.co';
    const STORAGE_KEY = 'saudi_events_key_v2';

    checkAuth();

    function checkAuth() {
        const key = localStorage.getItem(STORAGE_KEY);
        if (key) showApp(key);
        else {
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('app-screen').style.display = 'none';
        }
    }

    function saveKey() {
        const key = document.getElementById('apiKeyInput').value.trim();
        if (key.length > 20) {
            localStorage.setItem(STORAGE_KEY, key);
            checkAuth();
        } else {
            alert("المفتاح قصير جداً!");
        }
    }

    async function showApp(key) {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        const content = document.getElementById('content');

        const { createClient } = supabase;
        const client = createClient(PROJECT_URL, key);

        // جلب البيانات
        const { data, error } = await client.from('events').select('*').order('created_at', { ascending: false });

        if (data) {
            content.innerHTML = '';
            if (data.length === 0) content.innerHTML = '<p style="text-align:center">لا توجد فعاليات</p>';

            data.forEach(item => {
                // اختيار صورة افتراضية إذا لم يكن هناك رابط
                const imgUrl = item.image_url && item.image_url.startsWith('http') 
                    ? item.image_url 
                    : 'https://images.unsplash.com/photo-1514525253440-b393452e8d03?auto=format&fit=crop&w=500&q=80'; // صورة افتراضية جميلة

                content.innerHTML += `
                    <div class="card">
                        <img src="${imgUrl}" class="card-img" alt="صورة الفعالية">
                        <div class="card-body">
                            <h2>${item.title || 'بدون عنوان'}</h2>
                            <p>${item.description || 'لا يوجد وصف'}</p>
                            <div class="meta">
                                <div class="price">${item.price ? item.price + ' ريال' : 'مجاني'}</div>
                                <div class="location">📍 ${item.city || 'السعودية'}</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }
    }

    function logout() {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
</script>

</body>
</html>
