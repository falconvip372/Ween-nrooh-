<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وين نروح؟ - إصلاح شامل</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root { --primary: #4f46e5; --bg: #f8fafc; --text: #1e293b; }
body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; }

.navbar { background: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 20px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }

.logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; cursor: pointer; }

.nav-btn { background: #e2e8f0; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #475569; transition: 0.3s; }
.nav-btn.active { background: var(--primary); color: white; }

.container { max-width: 600px; margin: 20px auto; padding: 0 20px 80px; }
.screen { display: none; animation: fadeIn 0.4s; }
.screen.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* البطاقات */
.card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px -5px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #fff; }

.image-wrapper {
height: 200px;
background: linear-gradient(135deg, #e0e7ff 0%, #c7d2fe 100%);
position: relative; display: flex; align-items: center; justify-content: center; color: #4338ca; font-weight: bold;
}
.card-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
.card-body { padding: 20px; }

/* النماذج */
.form-box { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px -10px rgba(0,0,0,0.1); text-align: center; max-width: 400px; margin: 0 auto; }
input, textarea { width: 100%; padding: 14px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; font-family: inherit; font-size: 16px; }

.btn-main { background: var(--primary); color: white; width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 5px; }

.alert { padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.9rem; display: none; text-align: right; }
.alert.error { background: #fee2e2; color: #b91c1c; }
.alert.success { background: #dcfce7; color: #15803d; }

/* شاشة الإعداد */
#setup-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:999; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>

<!-- شاشة الإعداد (تظهر إذا لم يكن هناك مفتاح) -->
<div id="setup-screen" style="display:none;">
<div class="form-box">
<h2>⚙️ ضبط المصنع</h2>
<p style="color:#666;">يرجى إدخال مفتاح API لمرة واحدة</p>
<input type="text" id="apiKeyInput" placeholder="Supabase Key">
<button class="btn-main" onclick="saveKey()">حفظ وبدء التشغيل</button>
<p id="error-txt" style="color:red; margin-top:10px; display:none;"></p>
</div>
</div>

<nav class="navbar">
<a class="logo" onclick="showScreen('home')"><i class="fas fa-location-dot"></i> وين نروح؟</a>
<div>
<button class="nav-btn active" onclick="showScreen('home')">الرئيسية</button>
<button class="nav-btn" id="merchantBtn" onclick="showScreen('merchant')">دخول التاجر</button>
</div>
</nav>

<div class="container">

<!-- 1. الرئيسية -->
<div id="home-screen" class="screen active">
<div style="text-align: center; margin: 20px 0 30px;">
<h2 style="margin-bottom:5px">أحدث الوجهات 🌟</h2>
<p style="color:#64748b; margin:0">اكتشف، زر، واستمتع</p>
</div>
<div id="events-list">
<div style="text-align:center; padding:40px; color:#666;">جاري الاتصال... ⏳</div>
</div>
<div style="text-align:center; margin-top:20px;">
<button onclick="resetApp()" style="background:none; border:1px solid #ddd; padding:5px 10px; border-radius:5px; color:#888; cursor:pointer; font-size:0.8rem;">إعادة ضبط التطبيق 🔄</button>
</div>
</div>

<!-- 2. تسجيل الدخول -->
<div id="auth-screen" class="screen">
<div class="form-box">
<h2>بوابة الشركاء</h2>
<input type="email" id="email" placeholder="البريد الإلكتروني" dir="ltr">
<input type="password" id="password" placeholder="كلمة المرور" dir="ltr">
<button class="btn-main" onclick="handleAuth('login')">دخول</button>
<button class="btn-main" style="background:#334155; margin-top:10px;" onclick="handleAuth('signup')">حساب جديد</button>
<div id="auth-msg" class="alert"></div>
</div>
</div>

<!-- 3. لوحة التحكم -->
<div id="dashboard-screen" class="screen">
<div class="form-box">
<h3>📢 إضافة إعلان</h3>
<input type="text" id="newTitle" placeholder="عنوان العرض">
<input type="text" id="newPrice" placeholder="السعر">
<input type="text" id="newCity" placeholder="المدينة">
<button class="btn-main" onclick="addEvent()">نشر ✅</button>
<button onclick="logout()" style="margin-top:20px; background:none; border:none; color:red; cursor:pointer;">تسجيل خروج</button>
<div id="add-msg" class="alert"></div>
</div>
</div>

</div>

<script>
const PROJECT_URL = 'https://delpsaqasgfatojvnwkl.supabase.co';
const STORAGE_KEY = 'wein_nroh_clean_key_v4'; // مفتاح جديد تماماً
let supabase;

// بدء التشغيل
initApp();

function initApp() {
const savedKey = localStorage.getItem(STORAGE_KEY);

if (savedKey) {
document.getElementById('setup-screen').style.display = 'none';
try {
supabase = window.supabase.createClient(PROJECT_URL, savedKey);
loadEvents();
checkUser();
} catch (e) {
console.error(e);
// إذا فشل، اطلب المفتاح مجدداً
document.getElementById('setup-screen').style.display = 'flex';
}
} else {
document.getElementById('setup-screen').style.display = 'flex';
}
}

function saveKey() {
const key = document.getElementById('apiKeyInput').value.trim();
if (key.length > 20) {
localStorage.setItem(STORAGE_KEY, key);
location.reload();
} else {
document.getElementById('error-txt').innerText = "المفتاح قصير جداً";
document.getElementById('error-txt').style.display = "block";
}
}

function resetApp() {
if(confirm('هل تريد حذف البيانات المحفوظة وإعادة الإعداد؟')) {
localStorage.removeItem(STORAGE_KEY);
location.reload();
}
}

// --- التنقل ---
function showScreen(screenName) {
document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

if (screenName === 'home') {
document.getElementById('home-screen').classList.add('active');
loadEvents();
} else if (screenName === 'merchant') {
if(!supabase) return;
supabase.auth.getUser().then(res => {
if (res.data.user) {
document.getElementById('dashboard-screen').classList.add('active');
} else {
document.getElementById('auth-screen').classList.add('active');
}
});
}
}

// --- البيانات ---
async function loadEvents() {
const list = document.getElementById('events-list');
if(!supabase) return;

const { data, error } = await supabase.from('events').select('*').order('created_at', { ascending: false });

if (error) {
list.innerHTML = `<div style="text-align:center; color:red; padding:20px;">حدث خطأ: ${error.message}</div>`;
return;
}

if (data) {
list.innerHTML = '';
if(data.length === 0) list.innerHTML = '<div style="text-align:center; padding:40px; color:#666;">لا توجد فعاليات حالياً</div>';

data.forEach(item => {
const imgUrl = item.image_url || '';
const linkBtn = item.ticketLink ? `<a href="${item.ticketLink}" target="_blank" style="display:block; margin-top:10px; background:#1e293b; color:white; padding:10px; text-align:center; text-decoration:none; border-radius:8px;">حجز / تفاصيل</a>` : '';

list.innerHTML += `
<div class="card">
<div class="image-wrapper">
<span style="z-index:1">✨ صورة الفعالية</span>
<img src="${imgUrl}" class="card-img" onerror="this.style.display='none'">
<div style="position:absolute; bottom:10px; left:10px; background:white; padding:5px 10px; border-radius:15px; font-weight:bold; font-size:0.8rem; z-index:2;">${item.price} ريال</div>
</div>
<div class="card-body">
<h3 style="margin:0 0 5px;">${item.title}</h3>
<p style="color:#666; margin-bottom:10px;">${item.city || 'السعودية'}</p>
${linkBtn}
</div>
</div>
`;
});
}
}

// --- مصادقة مبسطة ---
async function handleAuth(type) {
const email = document.getElementById('email').value;
const password = document.getElementById('password').value;
const msg = document.getElementById('auth-msg');

msg.style.display = 'block';
msg.innerText = 'جاري المعالجة...';
msg.className = 'alert';

let result;
if (type === 'signup') result = await supabase.auth.signUp({ email, password });
else result = await supabase.auth.signInWithPassword({ email, password });

if (result.error) {
msg.className = 'alert error';
msg.innerText = result.error.message;
} else {
msg.className = 'alert success';
msg.innerText = 'تم بنجاح!';
if(type === 'login') showScreen('merchant');
}
}

async function checkUser() {
if(!supabase) return;
const { data } = await supabase.auth.getUser();
if (data.user) document.getElementById('merchantBtn').innerText = 'لوحة التحكم';
}

async function logout() {
await supabase.auth.signOut();
document.getElementById('merchantBtn').innerText = 'دخول التاجر';
showScreen('home');
}

async function addEvent() {
const title = document.getElementById('newTitle').value;
const price = document.getElementById('newPrice').value;
const city = document.getElementById('newCity').value;

const { error } = await supabase.from('events').insert({ title, price, city });

const msg = document.getElementById('add-msg');
msg.style.display = 'block';

if (error) {
msg.className = 'alert error'; msg.innerText = error.message;
} else {
msg.className = 'alert success'; msg.innerText = 'تم النشر!';
}
}
</script>

</body>
</html>
