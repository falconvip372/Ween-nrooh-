<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فعاليات السعودية</title>
    <!-- استدعاء Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- استدعاء الخطوط -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #10b981;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* --- تصميم شاشة الإعداد --- */
        #setup-screen {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 400px;
            margin: 60px auto;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            text-align: center;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        /* --- تصميم التطبيق --- */
        #app-screen { display: none; }

        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 { color: var(--primary); margin: 0; font-size: 2.5rem; }
        header p { color: #64748b; margin-top: 10px; }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border-right: 6px solid var(--primary);
            transition: transform 0.2s;
        }
        
        .card h2 { margin: 0 0 10px; color: #0f172a; font-size: 1.4rem; }
        .card p { color: #64748b; font-size: 1rem; margin-bottom: 20px; }
        
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 15px;
        }
        
        .price { 
            color: var(--primary); 
            font-weight: 800; 
            font-size: 1.1rem; 
        }
        
        .location {
            color: #94a3b8;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .logout-btn {
            display: block;
            margin: 40px auto;
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;
        }

        .error-msg { color: #ef4444; font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- شاشة إدخال المفتاح -->
    <div id="setup-screen">
        <h2>🔐 إعداد الاتصال</h2>
        <p>ألصق مفتاح API الخاص بك هنا لمرة واحدة:</p>
        <input type="text" id="apiKeyInput" placeholder="ألصق المفتاح هنا...">
        <button class="btn" onclick="saveAndConnect()">حفظ ودخول 🚀</button>
        <p id="error-msg" class="error-msg"></p>
    </div>

    <!-- شاشة التطبيق -->
    <div id="app-screen" class="container">
        <header>
            <h1>فعاليات السعودية 🎉</h1>
            <p>اكتشف أحدث الفعاليات والأنشطة الترفيهية</p>
        </header>

        <div id="content">
            <div style="text-align: center; color: #64748b;">جاري التحميل...</div>
        </div>

        <button onclick="logout()" class="logout-btn">تسجيل الخروج (حذف المفتاح)</button>
    </div>

<script>
    const PROJECT_URL = 'https://delpsaqasgfatojvnwkl.supabase.co';
    const STORAGE_KEY = 'saudi_events_key';

    // التحقق عند البدء
    checkLogin();

    function checkLogin() {
        const savedKey = localStorage.getItem(STORAGE_KEY);
        if (savedKey) {
            showApp(savedKey);
        } else {
            document.getElementById('setup-screen').style.display = 'block';
            document.getElementById('app-screen').style.display = 'none';
        }
    }

    async function saveAndConnect() {
        const keyInput = document.getElementById('apiKeyInput');
        const errorMsg = document.getElementById('error-msg');
        const key = keyInput.value.trim();

        if (key.length < 20) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = "المفتاح قصير جداً!";
            return;
        }

        errorMsg.style.display = 'none';
        
        try {
            // تجربة الاتصال
            const { createClient } = supabase;
            const client = createClient(PROJECT_URL, key);
            const { error } = await client.from('events').select('count').limit(1);

            if (error) throw error;

            // نجاح
            localStorage.setItem(STORAGE_KEY, key);
            checkLogin();

        } catch (err) {
            errorMsg.style.display = 'block';
            errorMsg.innerText = "المفتاح غير صحيح، تأكد من نسخه كاملاً.";
        }
    }

    async function showApp(key) {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'block';
        const content = document.getElementById('content');

        const { createClient } = supabase;
        const client = createClient(PROJECT_URL, key);

        const { data, error } = await client.from('events').select('*').order('created_at', { ascending: false });

        if (data && data.length > 0) {
            content.innerHTML = '';
            data.forEach(item => {
                content.innerHTML += `
                    <div class="card">
                        <h2>${item.title || 'بدون عنوان'}</h2>
                        <p>${item.description || 'لا يوجد وصف'}</p>
                        <div class="meta">
                            <div class="price">${item.price ? item.price + ' ريال' : 'مجاني'}</div>
                            <div class="location">📍 ${item.city || 'غير محدد'}</div>
                        </div>
                    </div>
                `;
            });
        } else {
            content.innerHTML = '<div style="text-align:center; padding:30px;">📭 لا توجد فعاليات حالياً (الجدول فارغ)</div>';
        }
    }

    function logout() {
        localStorage.removeItem(STORAGE_KEY);
        location.reload();
    }
</script>

</body>
</html>
