<!DOCTYPE html>

    <!-- المحتوى الرئيسي -->

        <!-- 3. صفحة تسجيل الدخول (للمنظمين) -->

        <!-- 5. صفحة إضافة فعالية جديدة -->

            <button class="mb-4 text-indigo-600 hover:underline nav-link" data-page="profile-page">
                &larr; العودة للوحة التحكم

            <section class="bg-white rounded-lg shadow-lg p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">إضافة فعالية جديدة</h2>
                <form id="add-event-form" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="md:col-span-2">
                        <label for="event-title" class="block text-sm font-medium text-gray-700 mb-1">عنوان الفعالية</label>
                        <input type="text" id="event-title" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label for="event-city" class="block text-sm font-medium text-gray-700 mb-1">المدينة</label>
                        <select id="event-city" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <option value="riyadh">الرياض</option>
                            <option value="jeddah">جدة</option>
                            <option value="dammam">الدمام/الخبر</option>
                            <option value="ula">العلا</option>
                        </select>
                    </div>
                    <div>
                        <label for="event-category" class="block text-sm font-medium text-gray-700 mb-1">التصنيف</label>
                        <select id="event-category" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <option value="food">طعام</option>
                            <option value="workshop">ورش عمل</option>
                            <option value="art">فن وثقافة</option>
                            <option value="music">موسيقى</option>
                            <option value="sport">رياضة</option>
                        </select>
                    </div>
                    <div>
                        <label for="event-date" class="block text-sm font-medium text-gray-700 mb-1">التاريخ</label>
                        <input type="date" id="event-date" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label for="event-price" class="block text-sm font-medium text-gray-700 mb-1">سعر التذكرة (ر.س)</label>
                        <input type="number" id="event-price" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="ادخل 0 إذا كانت مجانية" required>
                    </div>
                    <div class="md:col-span-2">
                        <label for="event-description" class="block text-sm font-medium text-gray-700 mb-1">الوصف</label>
                        <textarea id="event-description" rows="4" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" required></textarea>
                    </div>
                    
                    <!-- حقل رابط التذكرة -->
                    <div class="md:col-span-2">
                        <label for="event-ticket-link" class="block text-sm font-medium text-gray-700 mb-1">رابط شراء التذكرة (اختياري)</label>
                        <input type="url" id="event-ticket-link" class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="https://example.com/ticket">
                    </div>

                    <div class="md:col-span-2">

                    </div>
                    
                    <div class="md:col-span-2">
                        <button type="submit" class="w-full md:w-auto bg-green-600 text-white px-8 py-2 rounded-lg font-semibold hover:bg-green-700 transition-shadow shadow-md">

    <!-- ==================
         [جديد] منطق الجافاسكربت (Supabase)
       ================== -->
    <script type="module">
        // --- 1. إعداد Supabase ---
        const SUPABASE_URL = 'https://delpsaqasgfatojvnwkl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRlbHBzYXFhc2dmYXRvanZud2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjMzNzIzNzQsImV4cCI6MjA3ODk0ODM3NH0.pS0wijEolium8RJ08FfExuok8NJe4X-y1P2nAaRK4Z8';
        
        // استيراد العميل
        const { createClient } = supabase;
        // تهيئة الاتصال
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- 2. الصورة الافتراضية (عندما لا يرفع المستخدم صورة) ---
        // (سنستخدمها إذا فشل رفع الصورة، لكننا سنعرض الصور الحقيقية الآن)
        const DEFAULT_SVG_PLACEHOLDER = `
            <svg class="w-full h-full object-cover bg-gray-200 text-gray-500" role="img" aria-label="صورة الفعالية" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" preserveAspectRatio="xMidYMid slice">
                <rect fill="currentColor" width="100%" height="100%" fill-opacity="0.1"/>
                <text x="50%" y="50%" fill="currentColor" dy=".3em" font-size="24" text-anchor="middle" font-family="Inter, sans-serif">صورة الفعالية</text>
            </svg>`;

        // --- 3. حالة التطبيق (State) ---
        let currentUser = null;

        // --- 4. عناصر الواجهة (Selectors) ---
        const pages = document.querySelectorAll('.page');
        const navLinks = document.querySelectorAll('.nav-link');
        const loginNavBtn = document.getElementById('login-nav-btn');
        const profileNavBtn = document.getElementById('profile-nav-btn');
        const logoutBtn = document.getElementById('logout-btn');
        const eventsGrid = document.getElementById('events-grid');
        const myEventsGrid = document.getElementById('my-events-grid');
        const noEventsMsg = document.getElementById('no-events-msg');
        const notification = document.getElementById('notification');
        const notificationMessage = document.getElementById('notification-message');
        const detailsImageContainer = document.getElementById('details-image-container');
        const loadingOverlay = document.getElementById('loading-overlay');

        // --- 5. الدوال المساعدة (Helpers) ---
        function showPage(pageId) {
            pages.forEach(page => page.classList.toggle('active', page.id === pageId));
            window.scrollTo(0, 0);
        }
        
        function showNotification(message, isError = false) {
            notificationMessage.textContent = message;
            notification.classList.remove('hidden');
            notification.classList.toggle('bg-green-500', !isError);
            notification.classList.toggle('bg-red-500', isError);
            setTimeout(() => notification.classList.add('hidden'), 3000);
        }

        // إظهار/إخفاء شاشة التحميل
        function showLoading(isLoading) {
            loadingOverlay.classList.toggle('hidden', !isLoading);
            loadingOverlay.classList.toggle('flex', isLoading);
        }

        // تحديث أزرار النافبار بناءً على حالة تسجيل الدخول
        function updateNav(user) {
            currentUser = user;
            const isLoggedIn = !!user;
            loginNavBtn.classList.toggle('hidden', isLoggedIn);
            profileNavBtn.classList.toggle('hidden', !isLoggedIn);
            profileNavBtn.classList.toggle('flex', isLoggedIn);
        }

        function formatPrice(price) {
            if (price === 0) return 'مجاناً';
            return `${new Intl.NumberFormat('ar-SA').format(price)} ر.س`;
        }

        const translations = {
            music: 'موسيقى', food: 'طعام', art: 'فن وثقافة',
            workshop: 'ورش عمل', sport: 'رياضة', riyadh: 'الرياض',
            jeddah: 'جدة', dammam: 'الدمام/الخبر', ula: 'العلا'
        };

        /**
         * [جديد] إنشاء بطاقة فعالية (HTML) مع صور حقيقية
         */
        function createEventCard(event) {
            const sponsoredBadge = event.isSponsored ? 
                `<span class="absolute top-2 left-2 bg-yellow-400 text-yellow-900 px-3 py-1 text-xs font-bold rounded-md shadow">إعلان مميز</span>` : '';
            
            // [جديد] استخدام الصورة الحقيقية، وإذا لم توجد، استخدم الـ SVG
            const imageHtml = event.image_url 
                ? `<img src="${event.image_url}" alt="${event.title}" class="w-full h-56 object-cover bg-gray-200">`
                : `<div class="w-full h-56">${DEFAULT_SVG_PLACEHOLDER}</div>`;

            return `
                <div class="bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-xl relative">
                    ${sponsoredBadge}
                    ${imageHtml}
                    <div class="p-5">
                        <div class="flex justify-between items-center mb-2">
                            <span class="px-3 py-1 text-xs font-semibold rounded-full bg-indigo-100 text-indigo-700">
                                ${translations[event.category]}
                            </span>
                            <span class="text-xs text-gray-500">${translations[event.city]}</span>
                        </div>
                        <h3 class="text-xl font-bold text-gray-800 mb-3 truncate" title="${event.title}">
                            ${event.title}
                        </h3>
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold text-indigo-600">${formatPrice(event.price)}</span>
                            <button class="view-details-btn text-indigo-600 hover:underline font-medium" data-id="${event.id}">
                                التفاصيل
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /**
         * [جديد] عرض الفعاليات من قاعدة البيانات
         */
        async function renderEvents(filter = {}) {
            showLoading(true);
            
            // 1. بناء الاستعلام
            let query = db.from('events').select('*');
            
            // 2. تطبيق الفلاتر
            if (filter.city && filter.city !== 'all') {
                query = query.eq('city', filter.city);
            }
            if (filter.category && filter.category !== 'all') {
                query = query.eq('category', filter.category);
            }
            if (filter.date) {
                query = query.eq('date', filter.date);
            }
            
            // 3. جلب البيانات
            const { data, error } = await query
                .order('isSponsored', { ascending: false }) // الإعلان المميز أولاً
                .order('created_at', { ascending: false }); // الأحدث أولاً

            showLoading(false);

            if (error) {
                console.error('خطأ في جلب الفعاليات:', error.message);
                showNotification('حدث خطأ أثناء تحميل الفعاليات. (هل قمت بإنشاء الجدول والصلاحيات؟)', true);
                return;
            }

            // 4. عرض البيانات
            eventsGrid.innerHTML = '';
            if (data.length === 0) {
                eventsGrid.innerHTML = '<p class="text-gray-500 col-span-full text-center">لا توجد فعاليات مطابقة حالياً.</p>';
                return;
            }
            
            data.forEach(event => {
                eventsGrid.innerHTML += createEventCard(event);
            });
        }
        
        /**
         * [جديد] عرض فعاليات المستخدم (المنظم)
         */
        async function renderMyEvents() {
            if (!currentUser) return;

            showLoading(true);
            const { data, error } = await db.from('events')
                .select('*')
                .eq('owner_id', currentUser.id)
                .order('created_at', { ascending: false });
            
            showLoading(false);

            if (error) {
                console.error('خطأ في جلب فعالياتي:', error.message);
                return;
            }

            myEventsGrid.innerHTML = '';
            if (data.length > 0) {
                noEventsMsg.classList.add('hidden');
                data.forEach(event => {
                    myEventsGrid.innerHTML += createEventCard(event);
                });
            } else {
                noEventsMsg.classList.remove('hidden');
            }
        }

        // --- 6. معالجات الأحداث (Event Handlers) ---

        // (1) التنقل العام
        document.body.addEventListener('click', async (e) => {
            if (e.target.classList.contains('nav-link')) {
                e.preventDefault();
                const pageId = e.target.dataset.page;
                showPage(pageId);
                
                // [جديد] إذا ذهب لصفحة البروفايل، اعرض فعالياته
                if (pageId === 'profile-page' && currentUser) {
                    document.getElementById('welcome-message').textContent = `أهلاً بك، ${currentUser.email}!`;
                    await renderMyEvents();
                }
            }

            // [جديد] عرض التفاصيل من قاعدة البيانات
            if (e.target.classList.contains('view-details-btn')) {
                e.preventDefault();
                showLoading(true);
                const id = parseInt(e.target.dataset.id);
                
                const { data: event, error } = await db.from('events').select('*').eq('id', id).single();
                showLoading(false);

                if (error || !event) {
                    showNotification('لا يمكن العثور على هذه الفعالية.', true);
                    return;
                }
                
                // ملء صفحة التفاصيل بالبيانات الحقيقية
                detailsImageContainer.innerHTML = event.image_url 
                    ? `<img src="${event.image_url}" alt="${event.title}" class="w-full h-96 object-cover bg-gray-200">`
                    : `<div class="w-full h-96">${DEFAULT_SVG_PLACEHOLDER}</div>`;
                
                document.getElementById('details-title').textContent = event.title;
                document.getElementById('details-price').textContent = formatPrice(event.price);
                document.getElementById('details-location').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-1"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg> ${event.location || translations[event.city]}`;
                document.getElementById('details-date').innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ml-1"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg> ${event.date}`;
                document.getElementById('details-category').textContent = translations[event.category];
                document.getElementById('details-description').textContent = event.description;
                
                const ticketBtn = document.getElementById('details-ticket-btn');
                if(event.ticketLink) {
                    ticketBtn.href = event.ticketLink;
                    ticketBtn.classList.remove('hidden');
                } else {
                    ticketBtn.classList.add('hidden');
                }
                
                showPage('event-details-page');
            }
        });

        // (2) معالجة تسجيل الدخول وإنشاء الحساب
        const loginForm = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-submit-btn');
        const signupBtn = document.getElementById('signup-submit-btn');

        // أ) تسجيل الدخول
        loginBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            
            showLoading(true);
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            showLoading(false);

            if (error) {
                showNotification(`خطأ في تسجيل الدخول: ${error.message}`, true);
            } else {
                showNotification(`أهلاً بعودتك، ${data.user.email}!`);
                showPage('home-page'); // سيقوم onAuthStateChange بالباقي
            }
        });

        // ب) إنشاء حساب جديد
        signupBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (password.length < 6) {
                showNotification('كلمة المرور يجب أن تكون 6 أحرف على الأقل.', true);
                return;
            }

            showLoading(true);
            const { data, error } = await db.auth.signUp({ email, password });
            showLoading(false);
            
            if (error) {
                showNotification(`خطأ في إنشاء الحساب: ${error.message}`, true);
            } else {
                showNotification('تم إنشاء حسابك! الرجاء مراجعة إيميلك لتفعيل الحساب.');
                // (Supabase يتطلب تفعيل الإيميل افتراضياً)
                loginForm.reset();
            }
        });

        // (3) تسجيل الخروج
        logoutBtn.addEventListener('click', async () => {
            showLoading(true);
            await db.auth.signOut();
            showLoading(false);
            showNotification('تم تسجيل خروجك.');
            showPage('home-page');
        });
        
        // (4) معالجة الفلترة
        document.getElementById('filter-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const filter = {
                city: document.getElementById('filter-city').value,
                category: document.getElementById('filter-category').value,
                date: document.getElementById('filter-date').value
            };
            renderEvents(filter);
            showNotification('تم تطبيق الفلاتر.');
        });

        // (5) إضافة فعالية جديدة [جديد كلياً]
        document.getElementById('add-event-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) {
                showNotification('يجب تسجيل الدخول أولاً.', true);
                showPage('login-page');
                return;
            }

            const imageFile = document.getElementById('event-image').files[0];
            if (!imageFile) {
                showNotification('الرجاء اختيار صورة (بوستر) للفعالية.', true);
                return;
            }

            showLoading(true);

            // 1. رفع الصورة
            const fileExt = imageFile.name.split('.').pop();
            const fileName = `${currentUser.id}/${Date.now()}.${fileExt}`;
            const filePath = `public/${fileName}`; // المسار داخل الدلو

            const { data: uploadData, error: uploadError } = await db.storage
                .from('event-images') // اسم الدلو الذي أنشأته
                .upload(filePath, imageFile);

            if (uploadError) {
                showLoading(false);
                showNotification(`خطأ في رفع الصورة: ${uploadError.message}. (هل الصلاحيات صحيحة؟)`, true);
                console.error(uploadError);
                return;
            }

            // 2. الحصول على الرابط العام للصورة
            const { data: urlData } = db.storage
                .from('event-images')
                .getPublicUrl(uploadData.path);

            // 3. تجميع بيانات الفعالية
            const newEvent = {
                title: document.getElementById('event-title').value,
                city: document.getElementById('event-city').value,
                category: document.getElementById('event-category').value,
                date: document.getElementById('event-date').value,
                price: parseFloat(document.getElementById('event-price').value),
                description: document.getElementById('event-description').value,
                ticketLink: document.getElementById('event-ticket-link').value,
                image_url: urlData.publicUrl, // الرابط الحقيقي للصورة
                owner_id: currentUser.id, // ربط الفعالية بالمالك
                location: `${translations[document.getElementById('event-city').value]}` // (يمكن تحسينه لاحقاً)
            };

            // 4. حفظ الفعالية في قاعدة البيانات
            const { data: eventData, error: insertError } = await db.from('events').insert(newEvent);

            showLoading(false);
            
            if (insertError) {
                showNotification(`خطأ في حفظ الفعالية: ${insertError.message}`, true);
                console.error(insertError);
            } else {
                showNotification('تم نشر فعاليتك بنجاح!');
                e.target.reset();
                await renderEvents(); // تحديث الصفحة الرئيسية
                showPage('home-page');
            }
        });

        // --- 7. التشغيل عند تحميل الصفحة ---
        
        // (أ) مراقبة حالة تسجيل الدخول
        db.auth.onAuthStateChange((event, session) => {
            if (session) {
                updateNav(session.user);
            } else {
                updateNav(null);
            }
        });

        // (ب) تحميل الفعاليات لأول مرة
        document.addEventListener('DOMContentLoaded', () => {
            renderEvents({ city: 'all', category: 'all' });
        });

    </script>
</body>
</html>
